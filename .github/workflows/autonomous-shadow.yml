name: Autonomous morning shadow
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 Asia/Tokyo; actual original run creation fixes the date.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: autonomous-morning-shadow
  cancel-in-progress: false
jobs:
  shadow:
    if: github.repository == 'hm2236/jamio-news' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect primary sources or confirm the existing morning
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/autonomous.mjs shadow shadow-output
      - name: Retain immutable shadow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: shadow-output/
          retention-days: 14
          if-no-files-found: warn
