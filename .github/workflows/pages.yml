name: Publish JAMIO NEWS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  queue: max
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main manual deployment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Manual Pages deployment requires refs/heads/main' >&2
          exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check content and behavior
        run: |
          node scripts/validate.mjs
          node --test
      - name: Build static pages
        run: node scripts/build.mjs
      - name: Check reviewed series transitions
        if: github.event_name == 'pull_request'
        env:
          SERIES_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-series-change.mjs "$SERIES_BASE_SHA"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Fence stale Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pages-deploy-fence.mjs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment receipt
        run: node scripts/verify-deployment.mjs
      - name: Verify public series navigation receipt
        run: node scripts/verify-series-deployment.mjs
