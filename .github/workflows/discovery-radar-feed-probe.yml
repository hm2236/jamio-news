name: Discovery Radar official feed probe
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/discovery-radar-feed-probe.mjs
      - test/discovery-radar-feed-probe.test.mjs
      - docs/discovery-radar-feed-probe.md
      - .github/workflows/discovery-radar-feed-probe.yml
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'hm2236/jamio-news' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe fixed official feeds after conservative robots preflight
        env:
          PROBE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/discovery-radar-feed-probe.mjs
